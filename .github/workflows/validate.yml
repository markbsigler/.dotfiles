name: Validate dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bash: /bin/bash
            label: bash-3.2
          - os: macos-latest
            bash: /opt/homebrew/bin/bash
            label: bash-5
          - os: ubuntu-latest
            bash: /bin/bash
            label: bash-5
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.label }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: brew install bash zsh vim jq ripgrep shellcheck
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo -n apt-get update && sudo -n apt-get install -y zsh vim jq ripgrep shellcheck
      - name: Validate with selected Bash
        run: '"${{ matrix.bash }}" scripts/test-dotfiles.sh'
      - name: Redacted working-tree secret scan
        run: '"${{ matrix.bash }}" scripts/security-audit.sh'